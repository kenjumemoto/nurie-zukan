<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ぬりえずかん</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ぬりえずかん">
<meta name="theme-color" content="#8fd3f4">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
  :root {
    --sky: #8fd3f4; --sky2: #bfe9fb;
    --grass: #63c74d; --grass-dark: #3e8e41;
    --dirt: #8b5a2b; --dirt-dark: #5c3a1b;
    --paper: #fffdf6; --ink: #2b2118;
    --ok: #4cbb3a; --ok-dark: #2f8a25;
    --red: #e8322f; --red-dark: #a61d1b;
    --blue: #3f8fe0; --blue-dark: #235e9c;
    --gold: #f6c343; --gold-dark: #c98a12;
    --pot: clamp(40px, 8.4vh, 70px);
  }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body {
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky2) 100%);
    color: var(--ink); overflow: hidden;
    font-family: "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: background .8s;
  }
  body.night { background: linear-gradient(180deg, #0c1838 0%, #27407a 100%); }

  /* the same world as COINQUEST: blocky clouds + grass/dirt strip */
  .ground {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none;
    height: calc(46px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, var(--grass) 0 14px, var(--grass-dark) 14px 18px, var(--dirt) 18px 100%);
  }
  .ground::before {
    content: ""; position: absolute; inset: 0; opacity: .6;
    background-image: repeating-linear-gradient(90deg, transparent 0 28px, rgba(0,0,0,.08) 28px 32px);
  }
  body.night .ground { filter: brightness(.45); }
  .cloud {
    position: fixed; top: 7%; width: 120px; height: 36px; background: #fff; opacity: .85; z-index: 0; pointer-events: none;
    box-shadow: 24px -18px 0 0 #fff, 56px -12px 0 0 #fff, 76px 6px 0 0 #fff;
    animation: drift 70s linear infinite;
  }
  .cloud.c2 { top: 18%; animation-duration: 95s; animation-delay: -40s; transform: scale(.7); }
  @keyframes drift { from { left: -160px; } to { left: 110%; } }
  body.night .cloud { opacity: 0; }

  .scr {
    position: fixed; inset: 0; z-index: 1; box-sizing: border-box; display: none;
    padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
             calc(56px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  }
  .scr.on { display: flex; }

  /* blocky buttons (COINQUEST style) */
  .blk {
    appearance: none; border: 4px solid var(--d, var(--blue-dark)); background: var(--b, var(--blue));
    box-shadow: 0 7px 0 var(--d, var(--blue-dark)); color: #fff; padding: 0; margin: 0;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform .06s ease, box-shadow .06s ease;
  }
  .blk:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--d, var(--blue-dark)); }
  .blk svg { width: 58%; height: 58%; fill: #fff; stroke: none; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
  .blk.green { --b: var(--ok); --d: var(--ok-dark); }
  .blk.red { --b: var(--red); --d: var(--red-dark); }
  .blk.gold { --b: var(--gold); --d: var(--gold-dark); }
  .pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.09); } }

  .cr { display: block; width: 100%; height: 100%; overflow: visible; }

  /* ---------- start ---------- */
  #scrStart { flex-direction: column; align-items: center; justify-content: center; gap: 3vh; }
  #startArt { width: min(78vw, 64vh * 1.04); aspect-ratio: 25 / 24; animation: bob 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-2deg); } }
  #playBtn { width: clamp(96px, 17vh, 150px); height: clamp(96px, 17vh, 150px); border-radius: 0; }

  .wiggle { animation: wiggle .7s ease-in-out; }
  @keyframes wiggle { 20% { transform: rotate(-5deg) scale(1.04); } 50% { transform: rotate(5deg) scale(1.06); } 80% { transform: rotate(-2deg); } }

  /* ---------- paint ---------- */
  #scrPaint { gap: 18px; }
  #artWrap { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #art {
    position: relative; flex: none; background: var(--paper); touch-action: none;
    outline: 5px solid var(--dirt-dark); box-shadow: 0 10px 0 var(--dirt-dark);
  }
  #art > * { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #trailCv { opacity: .4; transition: opacity .5s; }
  #trailCv.fade { opacity: 0; }
  #side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  #pots { display: grid; grid-template-columns: repeat(2, var(--pot)); gap: calc(var(--pot) * .2); }
  .pot {
    appearance: none; border: 0; margin: 0; padding: 0; cursor: pointer;
    width: var(--pot); height: var(--pot); border-radius: 50%; background: var(--c);
    box-shadow: inset -6px -8px 0 rgba(0,0,0,.16), inset 6px 6px 0 rgba(255,255,255,.35), 0 5px 0 rgba(0,0,0,.28);
    transition: transform .12s;
  }
  .pot.white { box-shadow: inset -6px -8px 0 rgba(0,0,0,.10), 0 0 0 2px #d9d2c3 inset, 0 5px 0 rgba(0,0,0,.28); }
  .pot.rainbow { background: conic-gradient(#e8322f, #f7892b, #ffd42a, #3cb44b, #2f7de1, #8e4ec6, #ff7eb6, #e8322f); }
  .pot.sel { transform: scale(1.2); box-shadow: 0 0 0 5px #fff, 0 0 0 9px var(--ink), 0 6px 0 9px rgba(0,0,0,.2); z-index: 1; }
  #homeBtn { flex: none; width: calc(var(--pot) * 1.5); height: calc(var(--pot) * 1.2); }
  #doneBtn { flex: none; width: calc(var(--pot) * 2.2); height: calc(var(--pot) * 1.5); visibility: hidden; }
  #doneBtn.show { visibility: visible; animation: popin .4s ease-out; }
  #doneBtn.show.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @media (max-aspect-ratio: 1/1) {
    #scrPaint { flex-direction: column; }
    #side { flex-direction: row; flex-wrap: wrap; gap: 14px; }
    #pots { grid-template-columns: repeat(6, var(--pot)); }
    :root { --pot: min(11.5vw, 7vh, 64px); }
    #doneBtn { width: calc(var(--pot) * 2.2); height: calc(var(--pot) * 1.3); }
  }
  @media (min-aspect-ratio: 1/1) and (max-height: 520px) {
    :root { --pot: clamp(32px, 11vh, 52px); }
    #side { gap: 12px; }
    #pots { grid-template-columns: repeat(3, var(--pot)); }
    #doneBtn { width: calc(var(--pot) * 3.4); height: var(--pot); }
    #homeBtn { width: calc(var(--pot) * 1.6); height: var(--pot); }
  }

  /* ---------- alive ---------- */
  #scrAlive { flex-direction: column; align-items: center; justify-content: center; }
  #aliveStage { position: relative; flex: 1; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; padding-bottom: clamp(100px, 18vh, 150px); box-sizing: border-box; }
  #aliveCr { width: min(88vw, (100vh - 90px - clamp(100px, 18vh, 150px)) * 1.04); aspect-ratio: 25 / 24; transform-origin: 50% 92%; cursor: pointer; }
  #aliveCr.popin { animation: bigpop .7s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bigpop { from { transform: scale(.2) translateY(30%); opacity: 0; } to { transform: none; opacity: 1; } }
  #aliveCr.roar.idle { animation: stomp 1.6s ease-in-out infinite; }
  @keyframes stomp { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-2deg) translateY(-8px); } 50% { transform: rotate(0); } 75% { transform: rotate(2deg) translateY(-8px); } }
  #aliveCr.bug.idle, #aliveCr.other.idle { animation: hover 1.8s ease-in-out infinite; }
  @keyframes hover { 50% { transform: translateY(-14px) rotate(-3deg); } }
  #aliveCr.talk { animation: talk .18s linear infinite !important; }
  @keyframes talk { 0%,100% { transform: scale(1.04) rotate(-1.5deg); } 50% { transform: scale(1.08) rotate(1.5deg) translateY(-6px); } }
  #aliveCr.bug.fly { animation: fly 2.4s ease-in-out !important; }
  @keyframes fly { 0% { transform: none; } 25% { transform: translate(-22vw, -18vh) rotate(-25deg) scale(.7); } 50% { transform: translate(0, -26vh) rotate(0) scale(.6); } 75% { transform: translate(22vw, -14vh) rotate(25deg) scale(.7); } 100% { transform: none; } }
  /* "your turn": a speech bubble while the child answers out loud (nothing is recorded) */
  #turn {
    position: absolute; left: 50%; bottom: calc(58px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: clamp(120px, 20vh, 170px); pointer-events: none; animation: popin .3s ease-out;
    filter: drop-shadow(0 5px 0 rgba(0,0,0,.18));
  }
  #turn svg { display: block; width: 100%; height: auto; }
  #turn .dot { transform-box: fill-box; transform-origin: center; animation: dotb 1s ease-in-out infinite; }
  #turn .dot:nth-of-type(2) { animation-delay: .15s; }
  #turn .dot:nth-of-type(3) { animation-delay: .3s; }
  @keyframes dotb { 40% { transform: translateY(-9px); } 80% { transform: none; } }
  #nextBtn { position: absolute; right: calc(16px + env(safe-area-inset-right)); bottom: calc(66px + env(safe-area-inset-bottom)); width: 104px; height: 88px; }

  /* ---------- book ---------- */
  #scrBook { flex-direction: column; align-items: center; justify-content: center; }
  #bookGrid { display: grid; gap: 14px; max-height: 100%; overflow-y: auto; padding: 6px 6px 14px; box-sizing: border-box; -webkit-overflow-scrolling: touch; }
  .bcard {
    appearance: none; margin: 0; padding: 3%; cursor: pointer; aspect-ratio: 25 / 24; box-sizing: border-box;
    background: var(--paper); border: 4px solid var(--dirt-dark); box-shadow: 0 7px 0 var(--dirt-dark); position: relative;
  }
  .bcard.empty .cr { opacity: .35; }
  .bcard.new { animation: newcard 1s cubic-bezier(.3,1.6,.5,1); outline: 6px solid var(--gold); outline-offset: 4px; }
  @keyframes newcard { from { transform: scale(.3) rotate(-10deg); } to { transform: none; } }

  #gearBtn { position: absolute; top: calc(4px + env(safe-area-inset-top)); right: calc(6px + env(safe-area-inset-right)); width: 40px; height: 40px;
    padding: 0; border: 0; background: none; color: rgba(43,33,24,.35); -webkit-touch-callout: none; }
  #gearBtn svg { width: 100%; height: 100%; }
  #gearBtn.hold #gearRing { transition: stroke-dashoffset 2s linear; stroke-dashoffset: 0; }

  /* ---------- parent screen (grown-ups read this one, so ordinary Japanese) ---------- */
  #scrParent { background: #fbf8f1; overflow-y: auto; display: none; padding-bottom: calc(24px + env(safe-area-inset-bottom)); -webkit-user-select: text; user-select: text; }
  #scrParent.on { display: block; }
  #pp { max-width: 760px; margin: 0 auto; font-family: "Hiragino Sans", sans-serif; font-size: 16px; line-height: 1.6; color: var(--ink); }
  #pp h2 { font-size: 22px; margin: 8px 0; } #pp h3 { font-size: 18px; margin: 24px 0 8px; }
  .pnote { color: #5a4d42; margin: 6px 0 12px; }
  .pbtn { display: inline-block; appearance: none; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font: inherit; font-weight: 700; padding: 10px 18px; margin: 4px 0; cursor: pointer; }
  .pbtn.gray { background: #8a8178; } .pbtn:disabled { opacity: .4; }
  .pbtn input[type=file] { display: none; }
  #pPrevWrap canvas { width: 100%; height: auto; border: 2px solid #d8d0c4; border-radius: 8px; background: #fff; display: block; }
  .prow { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .prow input[type=text] { font: inherit; font-size: 20px; padding: 6px 10px; border: 2px solid #cfc6b8; border-radius: 8px; width: 12em; }
  .prow input[type=range] { width: 200px; } .psm { font-size: 13px; color: #7a6d62; }
  .pk { appearance: none; border: 2px solid #cfc6b8; background: #fff; border-radius: 20px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .pk.sel { border-color: var(--blue); background: #e6f0fc; font-weight: 700; }
  #pList { display: flex; flex-wrap: wrap; gap: 12px; }
  .pitem { width: 170px; background: #fff; border: 2px solid #e2dacd; border-radius: 10px; padding: 6px; text-align: center; }
  .pitem .cr { height: auto; } .pitem button { margin-top: 4px; }

  /* ---------- night ---------- */
  #scrNight { flex-direction: column; align-items: center; justify-content: flex-end; }
  #moon { position: absolute; top: 9%; right: 12%; width: 13vh; height: 13vh; border-radius: 50%; box-shadow: -3vh 2vh 0 0 #ffe9a3; transform: rotate(-20deg); }
  .star { position: absolute; width: 8px; height: 8px; background: #fff; animation: twinkle 2s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .2; } }
  #sleepRow { display: flex; align-items: flex-end; justify-content: center; gap: 1vw; width: 100%; }
  .sleeper { position: relative; width: min(22vw, 30vh * 1.25); aspect-ratio: 5 / 4; filter: brightness(.8) saturate(.9); animation: breathe 3s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes breathe { 50% { transform: scaleY(.96); } }
  .zzz { position: absolute; top: -4%; right: 8%; color: #fff; font: 800 5vh/1 "Arial Rounded MT Bold", sans-serif; animation: zzz 3s ease-in infinite; }
  @keyframes zzz { from { transform: translate(0, 0) scale(.6); opacity: 0; } 30% { opacity: 1; } to { transform: translate(3vw, -10vh) scale(1.2); opacity: 0; } }
  #sunBtn { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); width: 84px; height: 84px; }

  /* ---------- effects ---------- */
  #hand { position: fixed; z-index: 9; font-size: 64px; pointer-events: none; transition: left .9s ease-in-out, top .9s ease-in-out, opacity .3s; opacity: 0; filter: drop-shadow(0 4px 2px rgba(0,0,0,.3)); }
  .spark { position: fixed; z-index: 8; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; pointer-events: none; animation: spark .6s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  @keyframes popin { from { transform: scale(.3); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .cloud { animation: none; left: 12%; } }

  /* ---------- lab (for the developer only: #lab) ---------- */
  #lab { display: none; }
  body.lab #lab { display: grid; position: fixed; inset: 0; overflow: auto; z-index: 20; background: #fff; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; }
  body.lab #lab > div { border: 1px solid #ccc; aspect-ratio: 25 / 24; }
</style>
</head>
<body>
<div class="cloud"></div><div class="cloud c2"></div>
<div class="ground"></div>

<section id="scrStart" class="scr">
  <div id="startArt"></div>
  <button id="playBtn" class="blk green" aria-label="play"><svg viewBox="0 0 100 100"><path d="M30 18 L84 50 L30 82 Z"/></svg></button>
</section>

<section id="scrPaint" class="scr">
  <div id="artWrap">
    <div id="art">
      <svg id="baseSvg" viewBox="0 0 1000 960"></svg>
      <canvas id="paintCv"></canvas>
      <canvas id="trailCv"></canvas>
      <svg id="lineSvg" viewBox="0 0 1000 960"></svg>
    </div>
  </div>
  <div id="side">
    <button id="homeBtn" class="blk gold" aria-label="home"><svg viewBox="0 0 100 100"><path d="M50 10 L92 48 H79 V88 H58 V64 H42 V88 H21 V48 H8 Z"/></svg></button>
    <div id="pots"></div>
    <button id="doneBtn" class="blk green" aria-label="done"><svg viewBox="0 0 100 100"><path d="M14 52 L28 38 L43 53 L76 18 L90 32 L43 82 Z"/></svg></button>
  </div>
</section>

<section id="scrAlive" class="scr">
  <div id="aliveStage">
    <div id="aliveCr"></div>
  </div>
  <div id="turn" hidden><svg viewBox="0 0 170 120"><path d="M20 8 H150 Q162 8 162 20 V78 Q162 90 150 90 H98 L85 112 L72 90 H20 Q8 90 8 78 V20 Q8 8 20 8 Z" fill="#fff" stroke="#2b2118" stroke-width="6" stroke-linejoin="round"/><circle class="dot" cx="55" cy="49" r="11" fill="#2b2118"/><circle class="dot" cx="85" cy="49" r="11" fill="#2b2118"/><circle class="dot" cx="115" cy="49" r="11" fill="#2b2118"/></svg></div>
  <button id="nextBtn" class="blk" aria-label="next" hidden><svg viewBox="0 0 100 100"><path d="M12 38 H56 V16 L92 50 L56 84 V62 H12 Z"/></svg></button>
</section>

<section id="scrBook" class="scr">
  <div id="bookGrid"></div>
  <button id="gearBtn" aria-label="parent"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="6" stroke-dasharray="289" stroke-dashoffset="289" id="gearRing"/><path d="M44 10h12l2 12 8 4 10-7 8 8-7 10 4 8 12 2v12l-12 2-4 8 7 10-8 8-10-7-8 4-2 12H44l-2-12-8-4-10 7-8-8 7-10-4-8-12-2V44l12-2 4-8-7-10 8-8 10 7 8-4z M50 36a14 14 0 1 0 .1 0z" fill="currentColor" fill-rule="evenodd" transform="translate(50 50) scale(.6) translate(-50 -50)"/></svg></button>
</section>

<section id="scrParent" class="scr">
  <div id="pp">
    <h2>ぬりえを追加する（保護者用）</h2>
    <p class="pnote">ぬりえの画像（スクリーンショットや、紙のぬりえを真上から撮った写真）を選ぶと、線で囲まれたところが塗れるようになります。画像はこのiPadの中だけに保存され、外には送られません。</p>
    <label class="pbtn">画像を選ぶ<input type="file" id="pFile" accept="image/*"></label>
    <div id="pPrevWrap" hidden><canvas id="pPrev" width="1000" height="800"></canvas></div>
    <p id="pInfo" class="pnote"></p>
    <div id="pForm" hidden>
      <label class="prow">線のひろい方<span class="psm">少なめ</span><input type="range" id="pSens" min="1" max="10" value="5"><span class="psm">多め</span></label>
      <label class="prow">英語の名前<input type="text" id="pName" placeholder="shark" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="14"></label>
      <div class="prow">動き
        <button class="pk" data-k="roar">吠える（恐竜・動物）</button><button class="pk" data-k="bug">飛ぶ（虫・鳥）</button><button class="pk sel" data-k="other">そのほか</button>
      </div>
      <button id="pAdd" class="pbtn">ずかんに追加する</button>
    </div>
    <h3>追加したぬりえ</h3>
    <div id="pList"></div>
    <button id="pClose" class="pbtn gray">とじる</button>
  </div>
</section>

<section id="scrNight" class="scr">
  <div id="moon"></div>
  <div id="stars"></div>
  <div id="sleepRow"></div>
  <button id="sunBtn" class="blk gold" aria-label="morning" hidden><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="20"/><g id="rays"><rect x="46" y="4" width="8" height="16" rx="3"/><rect x="46" y="80" width="8" height="16" rx="3"/><rect x="4" y="46" width="16" height="8" rx="3"/><rect x="80" y="46" width="16" height="8" rx="3"/><rect x="46" y="4" width="8" height="16" rx="3" transform="rotate(45 50 50)"/><rect x="46" y="80" width="8" height="16" rx="3" transform="rotate(45 50 50)"/><rect x="4" y="46" width="16" height="8" rx="3" transform="rotate(45 50 50)"/><rect x="80" y="46" width="16" height="8" rx="3" transform="rotate(45 50 50)"/></g></svg></button>
</section>

<div id="hand">👆</div>
<div id="lab"></div>

<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const VW = 1000, AH = 800, VH = 960, INK = "#2b2118", LW = 9, BRUSH = 40;   // picture 1000x800, English word under it
  const SESSION_MAX = 3;   // colorings before "good night"

  // ---------------------------------------------------------------
  // SHAPE HELPERS (all art lives in a 1000 x 800 box)
  // ---------------------------------------------------------------
  const r1 = n => Math.round(n * 10) / 10;
  function E(cx, cy, rx, ry, rot) {             // ellipse as a path (works in SVG and Path2D)
    rot = rot || 0;
    const a = rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    const x0 = r1(cx + rx * c), y0 = r1(cy + rx * s), x1 = r1(cx - rx * c), y1 = r1(cy - rx * s);
    return "M" + x0 + " " + y0 + " A" + rx + " " + ry + " " + rot + " 0 1 " + x1 + " " + y1 + " A" + rx + " " + ry + " " + rot + " 0 1 " + x0 + " " + y0 + " Z";
  }
  function scallop(cx, cy, r, n, a0) {         // bumpy disc (triceratops frill)
    const pt = a => [r1(cx + r * Math.cos(a * Math.PI / 180)), r1(cy + r * Math.sin(a * Math.PI / 180))];
    let [x, y] = pt(a0), d = "M" + x + " " + y;
    for (let k = 1; k <= n; k++) {
      const [x2, y2] = pt(a0 + 360 * k / n), br = r1(Math.hypot(x2 - x, y2 - y) * 0.6);
      d += " A" + br + " " + br + " 0 0 1 " + x2 + " " + y2; x = x2; y = y2;
    }
    return d + " Z";
  }
  function xf(d, map, flip) {                   // move/flip a path (absolute commands only)
    const tk = d.match(/[A-Za-z]|-?\d*\.?\d+/g), argc = { M: 2, L: 2, C: 6, Q: 4, A: 7, Z: 0 };

        if (x < W - 1 && !line[j + 1] && !comp[j + 1]) { comp[j + 1] = nc; stack[sp++] = j + 1; }
        if (y > 0 && !line[j - W] && !comp[j - W]) { comp[j - W] = nc; stack[sp++] = j - W; }
        if (y < H - 1 && !line[j + W] && !comp[j + W]) { comp[j + W] = nc; stack[sp++] = j + W; }
      }
      size[nc] = sz; border[nc] = bd; box[nc] = [x0, y0, x1, y1];
    }
    const map = new Int16Array(nc + 1), boxes = [null];
    let n = 0;
    for (let c = 1; c <= nc; c++) {
      if (border[c]) map[c] = 0;                   // the paper around the picture
      else if (size[c] < 60 || n >= 30000) map[c] = -1;   // specks: treat as line
      else { map[c] = ++n; boxes[n] = box[c]; }
    }
    const lab = new Int16Array(N);
    for (let i = 0; i < N; i++) lab[i] = line[i] ? -1 : map[comp[i]];
    return { lab: lab, n: n, boxes: boxes };
  }
  function maskCanvas(lab, test, rgba) {            // a 1000x800 canvas painted where test(label) is true
    const c = document.createElement("canvas"); c.width = VW; c.height = AH;
    const x = c.getContext("2d"), im = x.createImageData(VW, AH), d = im.data;
    for (let i = 0; i < lab.length; i++) if (test(lab[i])) { d[i * 4] = rgba[0]; d[i * 4 + 1] = rgba[1]; d[i * 4 + 2] = rgba[2]; d[i * 4 + 3] = rgba[3]; }
    x.putImageData(im, 0, 0);
    return c;
  }
  function regionCanvas(cr, r) {                    // one region, cut to its box (cached)
    const rt = cr.rt;
    if (rt.rc[r]) return rt.rc[r];
    const b = rt.boxes[r], w = b[2] - b[0] + 1, h = b[3] - b[1] + 1, c = document.createElement("canvas");
    c.width = w; c.height = h;
    const x = c.getContext("2d"), im = x.createImageData(w, h), d = im.data;
    for (let y = 0; y < h; y++) for (let k = 0; k < w; k++) if (rt.lab[(b[1] + y) * VW + b[0] + k] === r) { const o = (y * w + k) * 4; d[o] = d[o + 1] = d[o + 2] = d[o + 3] = 255; }
    x.putImageData(im, 0, 0);
    return (rt.rc[r] = c);
  }
  // a saved entry {id, name, kind, lines} -> a creature the painting engine can use
  function makeCustom(c) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement("canvas"); cv.width = VW; cv.height = AH;
        const x = cv.getContext("2d"); x.drawImage(img, 0, 0, VW, AH);
        const d = x.getImageData(0, 0, VW, AH).data, line = new Uint8Array(VW * AH);
        for (let i = 0; i < line.length; i++) line[i] = d[i * 4 + 3] > 128 ? 1 : 0;
        const reg = regionsOf(line), sil = maskCanvas(reg.lab, v => v > 0, [255, 255, 255, 255]);
        const cr = { id: c.id, name: c.name, word: c.name.toUpperCase(), kind: c.kind || "other", custom: true, lines: c.lines, details: [], parts: [],
          rt: { lab: reg.lab, boxes: reg.boxes, sil: sil, silURL: sil.toDataURL("image/png"), rc: {} } };
        for (let r = 1; r <= reg.n; r++) cr.parts.push({ id: "r" + r, n: "", r: r });
        addWord(cr);
        cr.details.forEach(dt => { dt.on = cr.parts.findIndex(q => q.id === dt.on); });
        resolve(cr);
      };
      img.onerror = reject;
      img.src = c.lines;
    });
  }
  function loadCustoms() {
    return Promise.all(readCustomList().map(c => makeCustom(c).catch(() => null))).then(list => {
      customs = list.filter(Boolean);
      if ($("scrBook").classList.contains("on")) renderHome(null);
    });
  }

  // the gear on the home screen: hold it for 2 seconds (so little hands don't open it by chance)
  let gearT = 0;
  const gear = $("gearBtn");
  gear.addEventListener("pointerdown", e => {
    e.preventDefault(); gear.classList.add("hold");
    gearT = setTimeout(() => { gear.classList.remove("hold"); stopSay(); showParent(); }, 2000);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => gear.addEventListener(ev, () => { clearTimeout(gearT); gear.classList.remove("hold"); }));

  let pImg = null, pLab = null, pKind = "other";
  function showParent() {
    show("scrParent");
    pImg = null; pLab = null; $("pFile").value = ""; $("pName").value = "";
    $("pPrevWrap").hidden = true; $("pForm").hidden = true; $("pInfo").textContent = "";
    renderParentList();
  }
  function renderParentList() {
    const list = readCustomList();
    $("pList").innerHTML = list.length ? list.map(c => {
      const cr = byId(c.id);
      return '<div class="pitem">' + (cr ? creatureSVG(cr, save.book[c.id] ? { entry: save.book[c.id] } : {}) : "") +
        '<div>' + c.name + '</div><button class="pbtn gray" data-del="' + c.id + '">消す</button></div>';
    }).join("") : '<p class="pnote">まだありません。</p>';
  }
  function processPicture() {
    if (!pImg) return;
    const line = linesFromImage(pImg, +$("pSens").value), reg = regionsOf(line);
    pLab = reg.lab;
    const cv = $("pPrev"), x = cv.getContext("2d"), im = x.createImageData(VW, AH), d = im.data;
    const tint = [0];                              // show each paintable area in its own light color
    for (let r = 1; r <= reg.n; r++) { const h = (r * 137.5) % 360, a = h * Math.PI / 180; tint[r] = [200 + 40 * Math.cos(a), 200 + 40 * Math.cos(a + 2.1), 200 + 40 * Math.cos(a + 4.2)]; }
    for (let i = 0; i < pLab.length; i++) {
      const v = pLab[i], o = i * 4;
      if (v < 0) { d[o] = 30; d[o + 1] = 26; d[o + 2] = 22; } else if (v === 0) { d[o] = d[o + 1] = d[o + 2] = 235; } else { d[o] = tint[v][0]; d[o + 1] = tint[v][1]; d[o + 2] = tint[v][2]; }
      d[o + 3] = 255;
    }
    x.putImageData(im, 0, 0);
    $("pPrevWrap").hidden = false; $("pForm").hidden = false;
    $("pInfo").textContent = reg.n === 0 ? "塗れるところが見つかりません。線で囲まれた絵を選ぶか、「線のひろい方」を多めにしてください。"
      : "色がついたところ（" + reg.n + "か所）が塗れます。灰色は塗れない外側です。" +
        (reg.n > 150 ? "細かすぎるので、「線のひろい方」を少なめにすると塗りやすくなります。" : "線が切れて外とつながっているところは塗れません。そのときは「線のひろい方」を多めにしてください。");
    $("pAdd").disabled = reg.n === 0;
  }
  $("pFile").addEventListener("change", () => {
    const f = $("pFile").files && $("pFile").files[0];
    if (!f) return;
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => { pImg = img; processPicture(); URL.revokeObjectURL(url); };
    img.onerror = () => { $("pInfo").textContent = "この画像は読みこめませんでした。"; };
    img.src = url;
  });
  $("pSens").addEventListener("change", processPicture);
  document.querySelectorAll(".pk").forEach(b => b.addEventListener("click", () => {
    pKind = b.dataset.k;
    document.querySelectorAll(".pk").forEach(k => k.classList.toggle("sel", k === b));
  }));
  $("pAdd").addEventListener("click", () => {
    const name = $("pName").value.trim().replace(/\s+/g, " ");
    if (!/^[A-Za-z][A-Za-z -]{0,13}$/.test(name)) { $("pInfo").textContent = "英語の名前を、アルファベットで入れてください（14文字まで。例：shark）。"; $("pName").focus(); return; }
    if (!pLab) return;
    const lines = maskCanvas(pLab, v => v < 0, [43, 33, 24, 255]).toDataURL("image/png");
    const entry = { id: "u" + Date.now().toString(36), name: name.toLowerCase(), kind: pKind, lines: lines };
    const list = readCustomList().concat([entry]);
    try { localStorage.setItem(CKEY, JSON.stringify(list)); }
    catch (e) { $("pInfo").textContent = "iPadの保存場所がいっぱいで追加できませんでした。使っていないぬりえを消してください。"; return; }
    makeCustom(entry).then(cr => {
      customs.push(cr);
      pImg = null; pLab = null; $("pFile").value = ""; $("pName").value = "";
      $("pPrevWrap").hidden = true; $("pForm").hidden = true;
      $("pInfo").textContent = "「" + entry.name + "」をずかんに追加しました。";
      renderParentList();
    });
  });
  $("pList").addEventListener("click", e => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    const id = b.dataset.del, c = readCustomList().find(k => k.id === id);
    if (!c || !confirm("「" + c.name + "」を消します。塗った絵も消えます。よろしいですか？")) return;
    localStorage.setItem(CKEY, JSON.stringify(readCustomList().filter(k => k.id !== id)));
    customs = customs.filter(k => k.id !== id);
    delete save.book[id]; delete drafts[id]; store();
    renderParentList();
  });
  $("pClose").addEventListener("click", () => showHome(null));
  const parentTest = (img, name, kind, sens) => {   // for automated checks: the same steps as the screen
    showParent(); pImg = img; if (sens) $("pSens").value = sens; processPicture();
    if (!name) return;
    $("pName").value = name; pKind = kind || "other"; $("pAdd").click();
  };


  // ----- night: a clear place to stop -----
  function showNight() {
    show("scrNight");
    let st = "";
    for (let k = 0; k < 18; k++) st += '<div class="star" style="left:' + (4 + Math.random() * 92) + '%;top:' + (4 + Math.random() * 45) + '%;animation-delay:' + (-Math.random() * 2) + 's"></div>';
    $("stars").innerHTML = st;
    const ids = sessionIds.slice(-4);
    $("sleepRow").innerHTML = ids.map((id, k) => '<div class="sleeper" style="animation-delay:' + (-k * .7) + 's">' +
      creatureSVG(byId(id), { entry: save.book[id], noShadow: true, noWord: true }) + '<div class="zzz" style="animation-delay:' + (-k * .9) + 's">z</div></div>').join("");
    $("sunBtn").hidden = true;
    later(() => sayQ([{ t: "It's night time." }].concat(ids.map(id => ({ t: "Good night, " + byId(id).name + "." }))).concat([{ t: "See you tomorrow!" }])), 600);
    later(() => { $("sunBtn").hidden = false; }, 15000);
  }
  $("sunBtn").onclick = () => { unlockAudio(); sessionDone = 0; sessionIds = []; sayQ([{ t: "Good morning!" }]); showHome(null); };

  // ---------------------------------------------------------------
  // iOS: no zoom / callouts while little hands are everywhere
  // ---------------------------------------------------------------
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("dblclick", e => e.preventDefault());
  document.addEventListener("visibilitychange", () => { if (document.hidden) { stopSay(); scribbleOff(); } });

  // debug handle for automated checks
  loadCustoms();
  window.__nz = { paintState: () => ({ done: pDone.slice(), spelled: spelled, letters: cur.parts.map((q, i) => q.L ? i : -1).filter(i => i >= 0) }), parentTest: parentTest, showParent: showParent, customs: () => customs, makeCustom: makeCustom, linesFromImage: linesFromImage, regionsOf: regionsOf, save: () => save, colorWord: colorWord, CREATURES: CREATURES, showAlive: showAlive, showNight: showNight, showHome: showHome, sessionIds: () => sessionIds, creatureSVG: creatureSVG, byId: byId, startPaint: startPaint, unlock: unlockAudio, actx: () => actx };

  // developer views: #lab (all art), #paint=trex (jump straight in)
  const hash = location.hash.slice(1);
  if (hash.indexOf("lab") === 0) {
    document.body.classList.add("lab");
    const demo = { red: "#e8322f", orange: "#f7892b", yellow: "#ffd42a", green: "#3cb44b", blue: "#2f7de1", purple: "#8e4ec6", pink: "#ff7eb6", brown: "#8b5a2b" };
    const cols = Object.values(demo);
    const only = hash.split("=")[1];
    $("lab").innerHTML = CREATURES.filter(cr => !only || only.split(",").indexOf(cr.id) >= 0).map(cr => {
      const fills = {}; cr.parts.forEach((q, i) => { fills[q.id] = cols[(i * 3) % cols.length]; });
      return '<div>' + creatureSVG(cr) + '</div><div>' + creatureSVG(cr, { fills: fills }) + '</div>';
    }).join("");
    return;
  }
  if (hash === "icon") {                         // makes icon-180.png (see make-icon.sh)
    let svg = creatureSVG(byId("trex"), { noShadow: true, noWord: true, fills: { body: "#3cb44b", tail: "#3cb44b", neck: "#3cb44b", head: "#3cb44b", leg: "#2f9a40", arm: "#3cb44b", belly: "#ffd42a", spot1: "#f7892b", spot2: "#e8322f", spot3: "#2f7de1" } });
    svg = svg.replace('viewBox="0 0 1000 800"', 'viewBox="30 40 940 940" width="720" height="720"');
    const img = new Image();
    img.onload = () => {
      const S = 720, cv = document.createElement("canvas"); cv.width = cv.height = S;
      const c = cv.getContext("2d"), g = c.createLinearGradient(0, 0, 0, S), gy = 600;
      g.addColorStop(0, "#8fd3f4"); g.addColorStop(1, "#bfe9fb"); c.fillStyle = g; c.fillRect(0, 0, S, S);
      c.fillStyle = "#63c74d"; c.fillRect(0, gy, S, 40); c.fillStyle = "#3e8e41"; c.fillRect(0, gy + 40, S, 12);
      c.fillStyle = "#8b5a2b"; c.fillRect(0, gy + 52, S, S);
      c.fillStyle = "rgba(0,0,0,.08)"; for (let x = 0; x < S; x += 64) c.fillRect(x + 56, gy, 8, S);
      c.drawImage(img, 20, 70, S, S);
      const out = document.createElement("canvas"); out.width = out.height = 180;
      const o = out.getContext("2d"); o.imageSmoothingQuality = "high"; o.drawImage(cv, 0, 0, 180, 180);
      document.body.innerHTML = '<pre id="icon">' + out.toDataURL("image/png") + '</pre>';
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    return;
  }
  if (hash.indexOf("paint=") === 0 && byId(hash.slice(6))) { startPaint(byId(hash.slice(6))); return; }
  if (hash === "book") { showHome(null); return; }
  showStart();
})();
</script>
